# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    # These packages are pinned by the Expo SDK (see the root `overrides` and
    # `expo/bundledNativeModules.json`). They must move together during an
    # Expo SDK upgrade (`npx expo install --fix`), never one at a time —
    # a lone bump desyncs the lockfile from `overrides` and breaks `npm ci`.
    #
    # Every rule below sets `update-types` rather than ignoring by name alone:
    # a name-only ignore also suppresses Dependabot *security* PRs, while an
    # `update-types` rule only affects routine version updates.
    ignore:
      # Exact pins in `overrides`: any version change breaks `npm ci`.
      - dependency-name: 'react'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
      - dependency-name: 'react-dom'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
      - dependency-name: 'react-native'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
      - dependency-name: 'react-native-reanimated'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
      - dependency-name: 'react-native-worklets'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
      # Tilde ranges in `overrides`: patches stay in range, so let them through.
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-gesture-handler'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-screens'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-safe-area-context'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Expo SDK packages: their major version is the SDK number, so a major
      # bump only works as part of a whole-SDK upgrade. Patches/minors within
      # the current SDK are safe and still flow through.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (the Go port) has no JS compiler API yet, which crashes
      # typescript-eslint under `expo lint`. Drop this once typescript-eslint
      # supports TS 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
