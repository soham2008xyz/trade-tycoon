# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    # These packages are pinned by the Expo SDK (see the root `overrides` and
    # `expo/bundledNativeModules.json`). They must move together during an
    # Expo SDK upgrade (`npx expo install --fix`), never one at a time —
    # a lone bump desyncs the lockfile from `overrides` and breaks `npm ci`.
    ignore:
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-gesture-handler'
      - dependency-name: 'react-native-reanimated'
      - dependency-name: 'react-native-screens'
      - dependency-name: 'react-native-worklets'
      - dependency-name: 'react-native-safe-area-context'
