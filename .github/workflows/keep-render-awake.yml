name: Keep Render standby awake

# Render's free web services spin down after 15 minutes without inbound
# requests and take about a minute to wake. Pinging every 10 minutes keeps the
# standby server (render.yaml) warm. Awake all month is at most 744 hours,
# inside the workspace's 750 free instance hours — but only while this is the
# workspace's sole free web service. See docs/DEPLOY.md → "Render standby".
#
# GitHub can delay scheduled runs under load, so an occasional gap may still
# exceed 15 minutes and let the server sleep once.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-render-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        # --max-time covers a cold start if the server did fall asleep;
        # --retry-all-errors also retries the 5xx Render returns mid-boot.
        run: >-
          curl --fail --silent --show-error
          --max-time 120 --retry 2 --retry-delay 15 --retry-all-errors
          https://trade-tycoon-server.onrender.com/api/health
