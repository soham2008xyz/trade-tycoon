name: Run Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7 # 7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build game logic package
        run: npm run build:game-logic

      - name: Lint client
        run: npm run lint

      - name: Type check client
        run: npm run type-check --workspace=apps/client

      - name: Type check server
        run: npm run type-check --workspace=apps/server

      - name: Type check game logic
        run: npm run type-check --workspace=packages/game-logic

      - name: Run tests
        run: npm test
