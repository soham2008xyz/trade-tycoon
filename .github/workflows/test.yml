name: Run Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build game logic package
        run: npm run build:game-logic

      - name: Lint client
        run: npm run lint

      - name: Type check client
        run: npm run type-check --workspace=apps/client

      - name: Type check server
        run: npm run type-check --workspace=apps/server

      - name: Type check game logic
        run: npm run type-check --workspace=packages/game-logic

      - name: Run tests
        run: npm test
